name: Deploy talentOS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (branch defaults come from scripts/branches.<env>.env)
        required: true
        type: choice
        options:
          - uat
          - prod
      component:
        description: What to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - frontend
          - backend
          - ai
          - mcp
          - recruithub
      be_branch:
        description: Backend branch (blank = env default)
        required: false
        type: string
      fe_branch:
        description: Frontend branch (blank = env default)
        required: false
        type: string
      ai_branch:
        description: AI branch (blank = env default)
        required: false
        type: string
      mcp_branch:
        description: MCP branch (blank = env default)
        required: false
        type: string
      rh_branch:
        description: Recruithub (talentOS_AI_II) branch (blank = env default)
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Resolves to the GitHub Environment named like the input (uat / prod).
    # Create each env in Settings > Environments with secrets SSH_HOST, SSH_USER, SSH_KEY.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve effective branches (input > env default)
        id: branches
        shell: bash
        env:
          ENV_NAME: ${{ inputs.environment }}
          BE_IN: ${{ inputs.be_branch }}
          FE_IN: ${{ inputs.fe_branch }}
          AI_IN: ${{ inputs.ai_branch }}
          MCP_IN: ${{ inputs.mcp_branch }}
          RH_IN: ${{ inputs.rh_branch }}
        run: |
          set -euo pipefail
          ENV_FILE="scripts/branches.${ENV_NAME}.env"
          if [ -f "$ENV_FILE" ]; then
            set -a; . "$ENV_FILE"; set +a
          fi
          echo "be_branch=${BE_IN:-${BE_BRANCH:-main}}" >> "$GITHUB_OUTPUT"
          echo "fe_branch=${FE_IN:-${FE_BRANCH:-main}}" >> "$GITHUB_OUTPUT"
          echo "ai_branch=${AI_IN:-${AI_BRANCH:-main}}" >> "$GITHUB_OUTPUT"
          echo "mcp_branch=${MCP_IN:-${MCP_BRANCH:-main}}" >> "$GITHUB_OUTPUT"
          echo "rh_branch=${RH_IN:-${RH_BRANCH:-main}}" >> "$GITHUB_OUTPUT"

      - name: Validate branch policy
        shell: bash
        env:
          ENV_NAME: ${{ inputs.environment }}
          BE_BRANCH: ${{ steps.branches.outputs.be_branch }}
          FE_BRANCH: ${{ steps.branches.outputs.fe_branch }}
          AI_BRANCH: ${{ steps.branches.outputs.ai_branch }}
          MCP_BRANCH: ${{ steps.branches.outputs.mcp_branch }}
          RH_BRANCH: ${{ steps.branches.outputs.rh_branch }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_branch_policy.py "$ENV_NAME" \
            --be-branch "$BE_BRANCH" \
            --fe-branch "$FE_BRANCH" \
            --ai-branch "$AI_BRANCH" \
            --mcp-branch "$MCP_BRANCH" \
            --rh-branch "$RH_BRANCH"

      - name: Check branches exist on remote
        shell: bash
        env:
          BE_BRANCH: ${{ steps.branches.outputs.be_branch }}
          FE_BRANCH: ${{ steps.branches.outputs.fe_branch }}
          AI_BRANCH: ${{ steps.branches.outputs.ai_branch }}
          MCP_BRANCH: ${{ steps.branches.outputs.mcp_branch }}
          RH_BRANCH: ${{ steps.branches.outputs.rh_branch }}
        run: |
          set -euo pipefail

          check_branch() {
            local repo="$1" branch="$2" label="$3"
            echo "Checking $label: $branch (repo: $repo)"
            if git ls-remote --heads "https://github.com/$repo.git" "$branch" 2>/dev/null | grep -q "refs/heads/$branch$"; then
              echo "  OK: '$branch' exists"
            elif git ls-remote --heads "https://github.com/$repo.git" HEAD >/dev/null 2>&1; then
              echo "  FAIL: '$branch' not found in $repo"
              exit 1
            else
              echo "  WARN: cannot reach $repo (private repo? auth required) — skipping existence check"
            fi
          }

          check_branch "avezqureshi15/talentOS_BE" "$BE_BRANCH" "be"
          check_branch "avezqureshi15/talentOS_FE" "$FE_BRANCH" "fe"
          check_branch "punith-webknot/talentOS_AI" "$AI_BRANCH" "ai"
          check_branch "punith-webknot/talentOS_MCP" "$MCP_BRANCH" "mcp"
          check_branch "avezqureshi15/talentOS_AI_II" "$RH_BRANCH" "rh"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            if [ ! -d /opt/talentos/talentOS_Infra/.git ]; then
              echo "[setup] first run — cloning talentOS_Infra..."
              mkdir -p /opt/talentos
              git clone https://github.com/avezqureshi15/talentOS_Infra.git /opt/talentos/talentOS_Infra
            fi
            cd /opt/talentos/talentOS_Infra
            git pull origin main
            bash scripts/deploy.sh "${{ inputs.environment }}" "${{ inputs.component }}" \
              --be-branch "${{ steps.branches.outputs.be_branch }}" \
              --fe-branch "${{ steps.branches.outputs.fe_branch }}" \
              --ai-branch "${{ steps.branches.outputs.ai_branch }}" \
              --mcp-branch "${{ steps.branches.outputs.mcp_branch }}" \
              --rh-branch "${{ steps.branches.outputs.rh_branch }}"
