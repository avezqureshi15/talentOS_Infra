upstream fe {
    server fe:80;
}

upstream be {
    server be:8001;
}

server {
    listen 80;
    server_name talentos.webknot-dev.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name talentos.webknot-dev.in;
    client_max_body_size 10M;

    ssl_certificate     /etc/letsencrypt/live/talentos.webknot-dev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talentos.webknot-dev.in/privkey.pem;


    location /api/ {
        proxy_pass http://be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kafka/ {
        proxy_pass http://console:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kafka;
    }

    location = /architecture.md {
        alias /usr/share/nginx/html/docs/architecture.md;
        default_type text/markdown;
    }

    # ai-recruitment-poc (recruithub) internal service calls -> talentOS BE
    location /internal/ {
        proxy_pass http://be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service JWT validation (ai-recruitment-poc -> talentOS BE peer JWKS)
    location = /.well-known/jwks.json {
        proxy_pass http://be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenBao (central secrets manager) ──────────────────────────────
    # /v1/*  → OpenBao API (used by local dev machines; IP-restricted via
    #          .bao-allowlist.conf — server services use the docker network,
    #          NOT this route).
    # /bao-token/* → scoped app tokens for local dev; IP-restricted AND
    #          basic-auth protected (served straight from the bao-shared volume).
    location /v1/ {
        include /etc/nginx/conf.d/.bao-allowlist.conf;
        proxy_pass http://openbao:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bao-token/be.token {
        auth_basic "talentOS OpenBao app token";
        auth_basic_user_file /etc/nginx/conf.d/.bao-htpasswd;
        include /etc/nginx/conf.d/.bao-allowlist.conf;
        alias /shared/be.token;
        default_type text/plain;
    }

    location = /bao-token/ai.token {
        auth_basic "talentOS OpenBao app token";
        auth_basic_user_file /etc/nginx/conf.d/.bao-htpasswd;
        include /etc/nginx/conf.d/.bao-allowlist.conf;
        alias /shared/ai.token;
        default_type text/plain;
    }

    location = /recruithub/api {
        return 301 /recruithub/api/;
    }

    location /recruithub/api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        rewrite ^/recruithub/api/?(.*)$ /$1 break;
        proxy_pass http://rh-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location = /recruithub/hr {
        return 301 /recruithub/hr/;
    }

    location /recruithub/hr/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        rewrite ^/recruithub/hr/?(.*)$ /$1 break;
        proxy_pass http://rh-hr-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /recruithub/candidate {
        return 301 /recruithub/candidate/;
    }

    location /recruithub/candidate/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        rewrite ^/recruithub/candidate/?(.*)$ /$1 break;
        proxy_pass http://rh-candidate-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
