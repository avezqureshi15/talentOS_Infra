services:

  # ── Kafka ──────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - talentos-net

  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentos
      POSTGRES_PASSWORD: talentos
      POSTGRES_DB: talentos
      SUPABASE_URL: ${SUPABASE_URL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - talentos-net

  # ── MCP Tool Server ────────────────────────────────────────────────
  mcp:
    build: ./talentOS_MCP
    restart: unless-stopped
    environment:
      TALENTOS_API_BASE_URL: http://be:8001
      TALENTOS_API_TIMEOUT: "30"
      PORT: "8000"
    networks:
      - talentos-net

  # ── AI Service ─────────────────────────────────────────────────────
  ai:
    build: ./talentOS_AI
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MCP_URL: http://mcp:8000/mcp
      DATABASE_URI: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_NAME: ${MODEL_NAME}
      EVALUATION_MODEL_NAME: ${EVALUATION_MODEL_NAME}
    command:
      [
        "uv", "run", "uvicorn", "Source.app.main:app",
        "--host", "0.0.0.0", "--port", "8003"
      ]
    networks:
      - talentos-net

  # ── Backend API ────────────────────────────────────────────────────
  be:
    build: ./talentOS_BE
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CORS_ALLOW_ORIGINS: http://${LINODE_PUBLIC_IP}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC_EVALUATION: resume.evaluation.queue
      KAFKA_TOPIC_EVALUATION_DLQ: resume.evaluation.dlq
      KAFKA_CONSUMER_GROUP: resume-evaluators
      KAFKA_EVALUATION_PARTITIONS: "6"
      AI_SERVICE_BASE_URL: http://ai:8003
      AI_SERVICE_TIMEOUT: "60"
      ATS_THRESHOLD_DEFAULT: "70"
      EVALUATION_MAX_ATTEMPTS: "3"
      EVALUATION_MIN_RESUME_CHARS: "100"
      FRONTEND_BASE_URL: http://${LINODE_PUBLIC_IP}
    command: >
      sh -c "
        uv run alembic stamp head 2>/dev/null;
        uv run alembic upgrade head 2>/dev/null;
        if [ \"$APP_ENV\" = \"development\" ]; then uv run python3 -m seed.run_seed; fi 2>/dev/null;
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8001
      "
    networks:
      - talentos-net

  # ── Backend Worker (Kafka consumer) ────────────────────────────────
  worker:
    build: ./talentOS_BE
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      be:
        condition: service_started
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC_EVALUATION: resume.evaluation.queue
      KAFKA_TOPIC_EVALUATION_DLQ: resume.evaluation.dlq
      KAFKA_CONSUMER_GROUP: resume-evaluators
      KAFKA_EVALUATION_PARTITIONS: "6"
      AI_SERVICE_BASE_URL: http://ai:8003
      AI_SERVICE_TIMEOUT: "60"
      ATS_THRESHOLD_DEFAULT: "70"
      EVALUATION_MAX_ATTEMPTS: "3"
      EVALUATION_MIN_RESUME_CHARS: "100"
    command: uv run python3 -m app.workers.evaluation_worker
    networks:
      - talentos-net

  # ── Frontend (static files) ────────────────────────────────────────
  fe:
    build:
      context: ./talentOS_FE
      args:
        VITE_BE_API_BASE_URL: /api/v1
        VITE_API_BASE_URL: ""
        VITE_APP_URL: http://${LINODE_PUBLIC_IP}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_SLOT_DURATION_MINUTES: "30"
        VITE_AI_SCAN_ANIMATION: "false"
    restart: unless-stopped
    networks:
      - talentos-net

  # ── Reverse Proxy ──────────────────────────────────────────────────
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fe
      - be
    networks:
      - talentos-net

volumes:
  postgres_data:

networks:
  talentos-net:
    driver: bridge
